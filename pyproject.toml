[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    ".venv",
    ".mypy_cache",
    ".ruff_cache",
    "__pycache__",
    "scratch",
    "output",
    "final",
    "runtime",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
    "SIM",
    "RUF",
    "ASYNC",
    "PERF",
]
ignore = [
    "ASYNC110",
    "ASYNC230",
    "PERF203",
]

[tool.ruff.format]
line-ending = "lf"
