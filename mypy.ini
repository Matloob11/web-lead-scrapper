[mypy]
python_version = 3.11
mypy_path = .
files = scraper, desktop_app, tools, tests, houzz_pro_scraper.py, gui_app.py
exclude = scratch/
namespace_packages = True
explicit_package_bases = True
show_error_codes = True

[mypy-playwright_stealth]
ignore_missing_imports = True

[mypy-playwright_stealth.*]
ignore_missing_imports = True

[mypy-PySide6.*]
ignore_missing_imports = True
